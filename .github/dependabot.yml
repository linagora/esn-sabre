# Dependabot version updates: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # pinned to a commit of a linagora fork branch
      # (dev-<branch>#<sha>): bumped by the bump-sabre-vobject workflow
      # or by hand, Dependabot cannot follow such a pin
      - dependency-name: sabre/vobject
      - dependency-name: sabre/xml
    groups:
      # minor and patch updates in one pull request, each major in its own
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
