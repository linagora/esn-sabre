[libdefaults]
    default_realm = TEST.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    # Docker DNS has no reverse records: never canonicalize the service host.
    rdns = false
    dns_canonicalize_hostname = false
    udp_preference_limit = 1

[realms]
    TEST.LOCAL = {
        kdc = kdc.test.local
        admin_server = kdc.test.local
    }

[domain_realm]
    .test.local = TEST.LOCAL
    test.local = TEST.LOCAL
